<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Radar — Zero to Dev</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0a0a0f;
    --surface:#12121a;
    --border:#1e1e2e;
    --text:#e2e8f0;
    --muted:#64748b;
    --emerald:#10b981;
    --emerald-dim:rgba(16,185,129,.15);
    --cyan:#06b6d4;
    --cyan-dim:rgba(6,182,212,.15);
  }
  html{font-size:16px}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:2rem 1rem;
    overflow-x:hidden;
  }
  /* ── ambient glow ── */
  body::before{
    content:'';
    position:fixed;
    top:-40%;left:-20%;
    width:140%;height:140%;
    background:
      radial-gradient(ellipse 600px 400px at 30% 20%, rgba(16,185,129,.06) 0%,transparent 70%),
      radial-gradient(ellipse 500px 500px at 70% 70%, rgba(6,182,212,.05) 0%,transparent 70%);
    pointer-events:none;
    z-index:0;
  }

  /* ── branding ── */
  .brand{
    position:relative;z-index:1;
    text-align:center;
    margin-bottom:1rem;
  }
  .brand h1{
    font-size:1.6rem;
    font-weight:700;
    letter-spacing:-.02em;
    background:linear-gradient(135deg,var(--emerald),var(--cyan));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .brand p{
    font-size:.85rem;
    color:var(--muted);
    margin-top:.25rem;
    letter-spacing:.04em;
    text-transform:uppercase;
  }

  /* ── chart card ── */
  .card{
    position:relative;z-index:1;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:1rem;
    padding:2rem 1.5rem 1.5rem;
    width:100%;
    max-width:720px;
    box-shadow:
      0 0 0 1px rgba(255,255,255,.03),
      0 24px 48px -12px rgba(0,0,0,.5);
  }
  .card-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:1rem;
  }
  .card-title{
    font-size:1.05rem;
    font-weight:600;
    color:var(--text);
  }
  .card-badge{
    font-size:.7rem;
    font-weight:600;
    letter-spacing:.06em;
    text-transform:uppercase;
    padding:.3rem .7rem;
    border-radius:9999px;
    border:1px solid var(--border);
    color:var(--muted);
    background:rgba(255,255,255,.03);
  }

  /* ── svg wrapper ── */
  .chart-wrap{
    width:100%;
    display:flex;
    justify-content:center;
  }
  .chart-wrap svg{
    width:100%;
    max-width:560px;
    height:auto;
  }

  /* ── grid & axis styles ── */
  .grid-ring{
    fill:none;
    stroke:rgba(255,255,255,.06);
    stroke-width:1;
  }
  .axis-line{
    stroke:rgba(255,255,255,.07);
    stroke-width:1;
  }
  .axis-label{
    fill:var(--muted);
    font-size:10.5px;
    font-weight:500;
    text-anchor:middle;
    dominant-baseline:middle;
  }
  .ring-label{
    fill:rgba(255,255,255,.15);
    font-size:9px;
    font-weight:400;
    text-anchor:middle;
    dominant-baseline:middle;
  }

  /* ── data polygons ── */
  .data-poly{
    stroke-width:2;
    stroke-linejoin:round;
    transition:opacity .3s ease;
  }
  .data-poly.emerald{
    fill:var(--emerald-dim);
    stroke:var(--emerald);
    filter:drop-shadow(0 0 6px rgba(16,185,129,.35));
  }
  .data-poly.cyan{
    fill:var(--cyan-dim);
    stroke:var(--cyan);
    filter:drop-shadow(0 0 6px rgba(6,182,212,.3));
  }

  /* ── data points ── */
  .data-dot{
    stroke-width:2;
    transition:r .3s ease;
  }
  .data-dot.emerald{
    fill:var(--emerald);
    stroke:var(--bg);
  }
  .data-dot.cyan{
    fill:var(--cyan);
    stroke:var(--bg);
  }

  /* ── legend ── */
  .legend{
    display:flex;
    justify-content:center;
    gap:2rem;
    margin-top:1.5rem;
    padding-top:1.25rem;
    border-top:1px solid var(--border);
  }
  .legend-item{
    display:flex;
    align-items:center;
    gap:.5rem;
    font-size:.85rem;
    font-weight:500;
    color:var(--text);
    cursor:pointer;
    transition:opacity .3s ease;
  }
  .legend-item:hover{opacity:.8}
  .legend-dot{
    width:10px;height:10px;
    border-radius:50%;
    flex-shrink:0;
  }
  .legend-dot.emerald{background:var(--emerald);box-shadow:0 0 8px rgba(16,185,129,.4)}
  .legend-dot.cyan{background:var(--cyan);box-shadow:0 0 8px rgba(6,182,212,.4)}
  .legend-muted{opacity:.35}

  /* ── stats row ── */
  .stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:1rem;
    margin-top:1.25rem;
  }
  .stat-box{
    background:rgba(255,255,255,.02);
    border:1px solid var(--border);
    border-radius:.75rem;
    padding:1rem;
    text-align:center;
  }
  .stat-box .val{
    font-size:1.4rem;
    font-weight:700;
    letter-spacing:-.02em;
  }
  .stat-box .val.emerald{color:var(--emerald)}
  .stat-box .val.cyan{color:var(--cyan)}
  .stat-box .lbl{
    font-size:.7rem;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.06em;
    margin-top:.15rem;
  }

  /* ── animation ── */
  @keyframes drawIn{
    from{opacity:0;transform:scale(.85)}
    to{opacity:1;transform:scale(1)}
  }
  .data-poly,.data-dot{
    animation:drawIn .8s cubic-bezier(.22,1,.36,1) both;
  }
  .data-poly.cyan,.data-dot.cyan{
    animation-delay:.15s;
  }

  /* ── responsive ── */
  @media(max-width:500px){
    body{padding:1rem .5rem}
    .card{padding:1.25rem 1rem 1rem}
    .axis-label{font-size:9px}
    .legend{gap:1rem}
    .stats{gap:.5rem}
    .stat-box .val{font-size:1.15rem}
  }
</style>
</head>
<body>

<div class="brand">
  <h1>Zero to Dev</h1>
  <p>Skill Radar Preview</p>
</div>

<div class="card">
  <div class="card-header">
    <span class="card-title">Skill Domain Comparison</span>
    <span class="card-badge">Live Preview</span>
  </div>

  <div class="chart-wrap">
    <svg id="radar" viewBox="0 0 560 540" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div class="legend" id="legend">
    <div class="legend-item" data-user="moe" onclick="toggleUser('moe')">
      <span class="legend-dot emerald"></span>
      <span id="legend-moe">Moe</span>
    </div>
    <div class="legend-item" data-user="brother" onclick="toggleUser('brother')">
      <span class="legend-dot cyan"></span>
      <span id="legend-brother">Brother</span>
    </div>
  </div>

  <div class="stats">
    <div class="stat-box">
      <div class="val emerald" id="avg-moe">—</div>
      <div class="lbl">Moe Avg</div>
    </div>
    <div class="stat-box">
      <div class="val cyan" id="avg-brother">—</div>
      <div class="lbl">Brother Avg</div>
    </div>
  </div>
</div>

<script>
(function(){
  /* ── configuration ── */
  const SKILLS = [
    'Programming\nFundamentals',
    'Data Structures\n& Algorithms',
    'Systems\nProgramming',
    'Software\nEngineering',
    'Networking',
    'Web\nSecurity',
    'Binary\nExploitation',
    'Cryptography',
    'Digital\nForensics',
    'Cloud\nSecurity'
  ];

  const USERS = {
    moe:     { label:'Moe',     color:'#10b981', fill:'rgba(16,185,129,.15)',  values:[88,75,62,80,55,70,45,60,50,58] },
    brother: { label:'Brother', color:'#06b6d4', fill:'rgba(6,182,212,.15)',   values:[70,82,78,65,72,85,80,55,68,74] }
  };

  const N       = SKILLS.length;
  const CX      = 280;
  const CY      = 260;
  const R       = 195;
  const RINGS   = 5;              // 20, 40, 60, 80, 100
  const START    = -Math.PI / 2;  // top

  const svg = document.getElementById('radar');
  const ns  = 'http://www.w3.org/2000/svg';

  /* ── helpers ── */
  function pt(i, r){
    const a = START + (2 * Math.PI / N) * i;
    return { x: CX + r * Math.cos(a), y: CY + r * Math.sin(a) };
  }

  function polyStr(radius){
    return Array.from({length:N},(_,i)=> pt(i, radius))
      .map(p=>`${p.x.toFixed(2)},${p.y.toFixed(2)}`).join(' ');
  }

  function el(tag, attrs, parent){
    const e = document.createElementNS(ns, tag);
    for(const [k,v] of Object.entries(attrs||{})) e.setAttribute(k,v);
    (parent||svg).appendChild(e);
    return e;
  }

  /* ── defs: glow filter ── */
  const defs = el('defs',{},svg);
  const gf   = el('filter',{id:'glow',x:'-50%',y:'-50%',width:'200%',height:'200%'},defs);
  el('feGaussianBlur',{in:'SourceGraphic',stdDeviation:'3',result:'blur'},gf);
  const fm = el('feMerge',{},gf);
  el('feMergeNode',{in:'blur'},fm);
  el('feMergeNode',{in:'SourceGraphic'},fm);

  /* ── grid rings ── */
  for(let r=1;r<=RINGS;r++){
    const radius = (R / RINGS) * r;
    el('polygon',{
      points: polyStr(radius),
      class: 'grid-ring'
    });
    // ring value label (on first axis)
    const lp = pt(0, radius);
    el('text',{
      x: lp.x + 12,
      y: lp.y + 1,
      class:'ring-label'
    }).textContent = String(r * 20);
  }

  /* ── axis lines & labels ── */
  for(let i=0;i<N;i++){
    const p = pt(i, R);
    el('line',{ x1:CX, y1:CY, x2:p.x, y2:p.y, class:'axis-line' });

    // label position — pushed slightly beyond the outer ring
    const lp = pt(i, R + 24);
    const txt = el('text',{
      x: lp.x,
      y: lp.y,
      class:'axis-label'
    });
    // Handle multiline skill names
    const lines = SKILLS[i].split('\n');
    if(lines.length === 1){
      txt.textContent = lines[0];
    } else {
      lines.forEach((line, li)=>{
        const tspan = document.createElementNS(ns,'tspan');
        tspan.setAttribute('x', lp.x);
        tspan.setAttribute('dy', li === 0 ? '-0.4em' : '1.15em');
        tspan.textContent = line;
        txt.appendChild(tspan);
      });
      // re-center multi-line labels
      txt.setAttribute('y', lp.y - (lines.length - 1) * 5);
    }
  }

  /* ── user polygons & dots ── */
  const groups = {};
  for(const [key, user] of Object.entries(USERS)){
    const g = el('g',{id:`group-${key}`, filter:'url(#glow)'});

    // polygon
    const points = user.values.map((v,i)=>{
      const p = pt(i, (v / 100) * R);
      return `${p.x.toFixed(2)},${p.y.toFixed(2)}`;
    }).join(' ');
    el('polygon',{
      points,
      class: `data-poly ${key}`,
      'stroke-linejoin':'round'
    }, g);

    // dots
    user.values.forEach((v,i)=>{
      const p = pt(i, (v / 100) * R);
      el('circle',{
        cx: p.x.toFixed(2),
        cy: p.y.toFixed(2),
        r: 4,
        class: `data-dot ${key}`
      }, g);
    });

    svg.appendChild(g);
    groups[key] = g;
  }

  /* ── average scores ── */
  for(const [key, user] of Object.entries(USERS)){
    const avg = user.values.reduce((a,b)=>a+b,0) / user.values.length;
    document.getElementById(`avg-${key}`).textContent = avg.toFixed(1);
  }

  /* ── toggle visibility ── */
  window.toggleUser = function(key){
    const g     = groups[key];
    const label = document.getElementById(`legend-${key}`);
    const item  = label.closest('.legend-item');
    const hidden = g.style.opacity === '0';
    g.style.opacity       = hidden ? '1' : '0';
    g.style.transition    = 'opacity .3s ease';
    item.classList.toggle('legend-muted', !hidden);
  };

})();
</script>
</body>
</html>
