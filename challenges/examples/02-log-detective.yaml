title: "Log Detective"
slug: "log-detective-community"
phase: 3
difficulty: "medium"
category: "forensics"
expected_flag: "ZTD{brut3_f0rc3_succ3ss}"
description: "Analyze web server logs to identify a brute force attack and extract the flag from the successful request."
briefing: |
  A web server was attacked last night. You have been given the access log file. Your mission:

  1. Identify which IP address made the most failed login attempts (status 401)
  2. Find the timestamp of the first successful request (status 200) from that IP
  3. Extract the flag from the query parameter in that successful request

  The log format is standard Apache Combined Log Format. Look for patterns of repeated failures followed by a success — that is the signature of a brute force attack.

  ## Log Format
  ```
  IP - - [timestamp] "METHOD PATH HTTP/version" STATUS SIZE "referer" "user-agent"
  ```

