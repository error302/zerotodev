title: "Base64 Onion"
slug: "base64-onion"
phase: 1
difficulty: "easy"
category: "encoding"
expected_flag: "ZTD{l4y3r5_0n_l4y3r5}"
description: "Peel back multiple layers of Base64 encoding to reveal the hidden flag."
briefing: |
  An intercepted message has been encoded with multiple layers of Base64. Each time you decode it, you get another Base64 string. Your job is to keep decoding until you reach the plaintext flag.

  The encoded message has been provided in the setup files. Use Python, CyberChef, or any Base64 decoder to peel back the layers one at a time.

  ## Tips
  - Base64 strings typically end with `=` or `==` padding
  - Valid Base64 characters are A-Z, a-z, 0-9, +, /
  - A short Python script with a loop can automate the decoding

setup: |
  # The encoded message (5 layers of Base64)
  encoded = "Vm0weGIxRnVNbEpRVkRBOQ=="

  # Decode it step by step using Python:
  # import base64
  # result = base64.b64decode(encoded).decode()
  # Repeat until the result is no longer valid Base64

tools_hint: "Concepts: Base64 encoding, multi-layer decoding\nTools: Python base64 module, CyberChef\nYou do NOT need: any network access"
hint: "Write a Python loop that tries to decode the string repeatedly until it fails. The flag is buried 5 layers deep."
xp_reward: 80
