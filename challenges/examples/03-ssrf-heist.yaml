title: "SSRF Heist"
slug: "ssrf-heist"
phase: 4
difficulty: "hard"
category: "web"
expected_flag: "ZTD{ssrf_1nt3rn4l_r3sc0urc3}"
description: "Exploit a Server-Side Request Forgery vulnerability to access internal services and steal the flag."
briefing: |
  You have discovered a web application with a URL preview feature. When you submit a URL, the server fetches it and displays a preview. This is vulnerable to SSRF — you can make the server request internal resources that are not directly accessible.

  ## Your Objectives

  1. Identify the URL preview endpoint and its parameters
  2. Use SSRF to scan the internal network (try common internal IPs)
  3. Find the internal API that holds the flag
  4. Extract the flag from the internal API response

  ## Important Notes
  - The internal API runs on port 8080 on an internal IP
  - The web application is on port 3000
  - Direct access to the internal API is blocked by the firewall

  ## SSRF Techniques
  - Try `http://localhost:8080/` and `http://127.0.0.1:8080/`
  - Try `http://10.0.0.1:8080/` for internal network IPs
  - URL encoding and alternative representations may bypass filters

setup: |
  # Start the challenge environment
  docker-compose up -d

  # The web application is available at:
  # http://localhost:3000

  # The internal API (not directly accessible) runs at:
  # http://internal-api:8080/flag

  # Try the URL preview feature:
  # curl "http://localhost:3000/preview?url=http://example.com"

tools_hint: "Concepts: SSRF, internal network scanning, URL filtering bypass\nTools: curl, Burp Suite, browser DevTools\nYou do NOT need: any external network access"
hint: "The URL preview endpoint is at /api/preview?url=. Try submitting internal URLs. The flag is at /flag on the internal API service. If localhost is blocked, try 127.0.0.1, 0.0.0.0, or decimal IP representations."
xp_reward: 200
author: "WebSecExpert"
